upstream bench-frappe {
	server 127.0.0.1:8000 fail_timeout=0;
}

upstream bench-socketio-server {
	server 127.0.0.1:9000 fail_timeout=0;
}

server {
	listen 80 default_server;
	server_name _;
	root /home/frappe/frappe-bench/sites;

	location /assets {
		try_files $uri =404;
	}

	location ~ ^/protected/(.*) {
		internal;
		try_files /frontend/$1 =404;
	}

	location /socket.io {
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header X-Frappe-Site-Name frontend;
		proxy_set_header Origin $scheme://$http_host;
		proxy_set_header Host $host;
		proxy_pass http://bench-socketio-server;
	}

	location / {
		try_files /frontend/public/$uri @webserver;
	}

	location @webserver {
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Frappe-Site-Name frontend;
		proxy_set_header Host $host;
		proxy_set_header X-Use-X-Accel-Redirect True;
		proxy_read_timeout 120;
		proxy_redirect off;
		proxy_pass http://bench-frappe;
	}

	sendfile on;
	keepalive_timeout 15;
	client_max_body_size 50m;
	gzip on;
	gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
}
